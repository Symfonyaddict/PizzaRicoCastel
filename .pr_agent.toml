##############################
# PR-Agent — Configuration
# Projet : PizzaRicoCastel (Symfony 7 / PostgreSQL)
##############################

[config]
# Fournisseur et modele a utiliser
provider = "google"
model = "gemini-3.5-flash"

# Token maximum pour le contexte
max_model_tokens = 1000000

##############################
# Revue de code (/review)
##############################
[review]
# Niveau de détail : 1 (léger) à 9 (exhaustif)
review_level = 9

# Focus sur les domaines critiques pour ce projet
review_style = [
    "security",
    "best_practices",
    "readable"
]

# Mots-clés à ignorer dans la revue
ignore_list = [
    "generated by AI",
    "image_gen"
]

[review.auto_review_prompt]
instructions = [
    "Tu es un expert en sécurité Symfony dédiée au projet Pizzeria.",
    "Priorité 1 — Sécurité (CRITICAL/HIGH) :",
    "- Vérifie chaque contrôleur admin possède #[IsGranted('ROLE_ADMIN')].",
    "- Vérifie que chaque formulaire POST inclut un token CSRF valide.",
    "- Vérifie le respect de la règle CSP par nonce (pas d'unsafe-inline/unsafe-eval).",
    "- Vérifie que DATABASE_URL utilise PostgreSQL, jamais SQLite.",
    "- Vérifie qu'aucun secret (.env, APP_SECRET) n'est versionné.",
    "Priorité 2 — SEO :",
    "- Le canonical est construit depuis app.canonical_base_url (jamais de domaine en dur).",
    "- meta name=robots content=noindex quand APP_ENV != 'prod'.",
    "Priorité 3 — Code Quality :",
    "- Respect PSR-12 et conventions Symfony.",
    "- PHPStan level 5 doit passer."
]

[review.feedback_style]
# Format des commentaires : concise pour les lignes, détaillé pour le résumé
line_feedback = "concise"
summary_feedback = "detailed"

##############################
# Description de PR (/describe)
##############################
[describe]
auto_describe = false

##############################
# Amélioration (/improve)
##############################
[improve]
auto_improve = false

##############################
# Questions (/ask)
##############################
[ask]
# Ne répondre qu'aux questions posées explicitement
auto_ask = false
