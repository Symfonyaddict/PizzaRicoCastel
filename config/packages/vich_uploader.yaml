vich_uploader:
    db_driver: orm

    mappings:
        pizza_images:
            uri_prefix: /images/pizzas
            upload_destination: '%kernel.project_dir%/public/images/pizzas'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        hero_images:
            uri_prefix: /images/hero
            upload_destination: '%kernel.project_dir%/public/images/hero'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        boisson_images:
            uri_prefix: /images/boissons
            upload_destination: '%kernel.project_dir%/public/images/boissons'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        news_images:
            uri_prefix: /images/news
            upload_destination: '%kernel.project_dir%/public/images/news'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
